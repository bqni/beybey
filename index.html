<style>
/* ===== Design tokens ===== */
:root{
 /* Couleurs (thème par défaut « Atelier ») */
 --bg:#111318; --surface:#191C23; --surface-2:#14171D; --border:#2B303A;
 --text:#E5E7EB; --text-2:#9299A8;
 --accent:#7CCB9A; --accent-ink:#0E1A13; --accent-soft:rgba(124,203,154,.12);
 --pb:#E58FB4; --pb-ink:#2A0F1B;           /* rose = joueur B uniquement */
 --tile:#E4E7EC;                              /* fond des photos de pièces */
 /* Types, lignes, stats : teintes douces, utilisées en petits repères */
 --t-attack:#7BA7E6; --t-def:#6FBF8A; --t-stamina:#E2A95E; --t-balance:#E27F7F;
 --l-bx:#7BA7E6; --l-ux:#E2A95E; --l-cx:#D98BB5;
 --stat-a:#7BA7E6; --stat-d:#7CCB9A; --stat-s:#E2A95E;
 /* Espacements, rayons, tailles */
 --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px;
 --r-1:6px; --r-2:8px; --r-3:12px;
 --ctl-h:40px; --btn-h:48px; --tab-h:56px;
 /* Typographie : une seule famille, Inter */
 --font:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
 --fs-xs:11px; --fs-sm:12.5px; --fs-md:14px; --fs-lg:16px; --fs-xl:20px; --fs-2xl:28px; --fs-score:44px;
 --fw-regular:400; --fw-medium:500; --fw-semi:600; --fw-bold:700;
 /* alias utilisés par le script */
 --pa:var(--accent); --pink:var(--pb);
 color-scheme:dark;
}

/* ===== Base ===== */
*{box-sizing:border-box}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:var(--fw-regular) var(--fs-md)/1.4 var(--font);font-variant-numeric:tabular-nums;padding:env(safe-area-inset-top,0px) 0 calc(var(--tab-h) + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
button,select,input{font-family:var(--font)}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);padding:var(--sp-4) var(--sp-4) var(--sp-2)}
h1{font:var(--fw-semi) var(--fs-xl)/1.2 var(--font);letter-spacing:-.01em;margin:0}
.sub{color:var(--text-2);padding:0 var(--sp-4) var(--sp-3);font-size:var(--fs-sm)}.sub:empty{display:none}
.mut{color:var(--text-2);font-size:var(--fs-sm)}
#th{width:auto;height:32px;padding:0 var(--sp-2);font-size:var(--fs-sm);color:var(--text-2)}

/* ===== Contrôles uniformes ===== */
.frame,.mseg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--border);border-radius:var(--r-2);background:var(--surface-2);overflow:hidden}
.frame{margin:0 var(--sp-4) var(--sp-3)}
.frame button,.mseg button{height:var(--ctl-h);background:none;border:0;color:var(--text-2);font:var(--fw-medium) var(--fs-md)/1 var(--font);display:flex;gap:var(--sp-2);justify-content:center;align-items:center}
.mseg button{height:34px;font-size:var(--fs-sm)}
.frame button small{font-size:var(--fs-sm);opacity:.8}
.frame button.on,.mseg button.on{background:var(--accent-soft);color:var(--accent);font-weight:var(--fw-semi);box-shadow:inset 0 0 0 1px var(--accent)}
.bar{display:flex;gap:var(--sp-2);padding:0 var(--sp-4) var(--sp-3)}
.search{flex:1;min-width:0;display:flex;gap:var(--sp-2);align-items:center;height:var(--ctl-h);border:1px solid var(--border);border-radius:var(--r-2);background:var(--surface-2);padding:0 var(--sp-3);color:var(--text-2)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font-size:var(--fs-md)}
.search:focus-within{border-color:var(--accent)}
select,.nm{height:var(--ctl-h);width:100%;padding:0 var(--sp-2);font-size:var(--fs-md);border-radius:var(--r-2);border:1px solid var(--border);background:var(--surface-2);color:var(--text)}

.chips{display:flex;gap:var(--sp-2);padding:0 var(--sp-4) var(--sp-3);overflow-x:auto}

.chip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.chip.fl{height:var(--ctl-h);padding:0 var(--sp-3);white-space:nowrap;color:var(--text)}
.chip.sq{height:var(--ctl-h);width:var(--ctl-h);padding:0;font-size:var(--fs-lg);color:var(--text)}
.go{margin:var(--sp-3) var(--sp-4) 0;width:calc(100% - 2*var(--sp-4));height:var(--btn-h);padding:0 var(--sp-4);border:0;border-radius:var(--r-2);background:var(--accent);color:var(--accent-ink);font:var(--fw-semi) var(--fs-lg)/1 var(--font)}
.go:active{filter:brightness(.92)}
.go:disabled{opacity:.35}

/* ===== Listes ===== */

.gh{font:var(--fw-semi) var(--fs-xs)/1 var(--font);letter-spacing:.08em;text-transform:uppercase;padding:var(--sp-2) var(--sp-3);display:flex;gap:var(--sp-2);align-items:center;color:var(--text-2);background:var(--surface-2);border-bottom:1px solid var(--border)}
.rw,summary{display:grid;grid-template-columns:48px 1fr auto;gap:var(--sp-3);align-items:center;padding:var(--sp-2) var(--sp-3);list-style:none;cursor:pointer;min-height:56px}

.list>.rw,.list>details,.list>.empty{border-bottom:1px solid var(--border)}
.list>:last-child{border-bottom:0}

.pimg{width:48px;height:48px;border-radius:var(--r-2);background:var(--tile);border:1px solid var(--border);overflow:hidden}

.tp{display:inline-flex;gap:var(--sp-1);align-items:center}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.tot{font:var(--fw-semi) var(--fs-lg)/1 var(--font);color:var(--text);text-align:right}.tot small{font-size:var(--fs-sm);margin-left:2px;color:var(--text-2);font-weight:var(--fw-regular)}

.pc{display:grid;align-content:start;justify-items:center;gap:var(--sp-1);text-align:center;font-size:var(--fs-xs);color:var(--text-2)}
.pc b{color:var(--text);font:var(--fw-semi) var(--fs-md) var(--font)}

.empty{color:var(--text-2);text-align:center;padding:var(--sp-5) 0}

/* ===== Barres de stats ===== */
.sb{display:grid;gap:3px;width:100%;margin-top:2px}
.sb i{display:grid;grid-template-columns:10px 1fr 22px;gap:var(--sp-1);align-items:center;font-style:normal;font-size:10px;line-height:1;color:var(--text-2)}

.stl{font-size:var(--fs-sm);color:var(--text-2);margin-top:3px}.stl b{font-weight:var(--fw-semi);color:var(--text)}

/* ===== Build ===== */
.pcard{margin:0 var(--sp-4) var(--sp-3);padding:var(--sp-3);border:1px solid var(--border);border-radius:var(--r-3);background:var(--surface);display:grid;gap:var(--sp-3)}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-2)}
.bslot{display:grid;justify-items:center;gap:6px;min-width:0}
.bslot select{height:36px;padding:0 var(--sp-1);font-size:var(--fs-sm)}
.sl{font:var(--fw-semi) var(--fs-xs) var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--text-2)}
.bres{display:grid;gap:var(--sp-2);justify-items:center;text-align:center}.bres .tot{text-align:center;font-size:var(--fs-2xl)}
.bres .sb{max-width:320px}.bres .sb i{font-size:var(--fs-sm);grid-template-columns:14px 1fr 30px}.bres .sb i u{height:6px}.bres .sb i b{font-size:var(--fs-sm)}
.cmp{gap:var(--sp-1)}.ch{display:flex;justify-content:space-between;font:var(--fw-semi) var(--fs-lg) var(--font);padding:0 var(--sp-2)}
.cr{display:grid;grid-template-columns:1fr 1.3fr 1fr;align-items:center;text-align:center;padding:5px 0;border-top:1px solid var(--border)}
.cr span{color:var(--text-2);font-size:var(--fs-sm);display:grid}.cr span small{font-size:10px}
.cr b{font:var(--fw-semi) var(--fs-lg) var(--font);color:var(--text)}.cr b.cw.a{color:var(--pa)}.cr b.cw.b{color:var(--pink)}.cr b.tie{color:var(--text-2);opacity:.5}

/* ===== Match : préparation ===== */
.rules{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-2);padding:0 var(--sp-4) var(--sp-3)}
.rules label,.g3 label{font-size:var(--fs-xs);color:var(--text-2);display:block}
.rules select,.g3 select{margin-top:var(--sp-1)}
.note{padding:0 var(--sp-4) var(--sp-3)}
.nm{color:var(--pc);font-weight:var(--fw-semi);font-size:var(--fs-lg);padding:0 var(--sp-3)}
.slot{display:grid;gap:var(--sp-2)}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.g3 select{height:36px;font-size:var(--fs-sm)}
.prv{display:flex;gap:var(--sp-3);align-items:center}.prv b{font:var(--fw-semi) var(--fs-md) var(--font)}
.opts{display:flex;gap:var(--sp-4);padding:var(--sp-1) var(--sp-4);align-items:center;font-size:var(--fs-md);color:var(--text-2)}
.opts label{display:flex;gap:var(--sp-2);align-items:center}
.opts input{accent-color:var(--accent);width:18px;height:18px}

/* ===== Navigation ===== */
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;height:var(--tab-h);border:0;background:none;color:var(--text-2);font:var(--fw-medium) var(--fs-xs) var(--font);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tabs button.on{color:var(--accent)}

/* ===== Match : plein écran ===== */
#ov{position:fixed;inset:0;display:none;background:var(--bg);z-index:20;text-align:center;overflow:auto;padding:calc(var(--sp-3) + env(safe-area-inset-top,0px)) var(--sp-3) var(--sp-3)}
#ov.show{display:block}
.cd{display:flex;flex-direction:column;align-items:center;justify-content:center;height:calc(100vh - 40px);text-align:center}
#ov .cd{position:relative}
.ringw{position:relative;width:min(70vw,60vh,320px);aspect-ratio:1;display:grid;place-items:center;z-index:1}
.ringw svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ringw circle{fill:none;stroke-width:2.5}
.rt{stroke:var(--border)}
.rg{stroke:var(--accent);stroke-linecap:butt;stroke-dasharray:100;stroke-dashoffset:100}

.rays{position:fixed;left:50%;top:50%;width:200vmax;height:200vmax;margin:-100vmax 0 0 -100vmax;background:repeating-conic-gradient(from 0deg,var(--accent-soft) 0 6deg,transparent 6deg 18deg);opacity:.55;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.flash{position:fixed;inset:0;background:var(--accent);opacity:0;pointer-events:none}
.lines{position:absolute;left:0;right:0;top:50%;height:0}
.lines i{position:absolute;left:-60%;height:2px;width:60%;background:linear-gradient(90deg,transparent,var(--accent))}
.lines i:nth-child(1){top:-28px}.lines i:nth-child(2){top:26px;width:45%}
.cd.hv .lines i{animation:sweep .45s ease-out forwards}.cd.hv .lines i:nth-child(2){animation-delay:.08s}

.cd.hv .flash{animation:flash .5s ease-out}
@keyframes flash{from{opacity:.35}to{opacity:0}}
#duel{font:var(--fw-medium) var(--fs-lg) var(--font);color:var(--text-2);margin-top:var(--sp-5);z-index:1;letter-spacing:.02em}
@media (prefers-reduced-motion:no-preference){#big.pop{animation:pop .35s cubic-bezier(.2,.9,.3,1.2)}@keyframes pop{from{transform:skewX(-8deg) scale(1.5);opacity:0}to{transform:skewX(-8deg);opacity:1}}#big.txt.pop{animation:hyper .5s cubic-bezier(.2,.9,.3,1)}@keyframes hyper{from{transform:skewX(-8deg) translateX(-40%) scale(1.2);opacity:0;letter-spacing:.3em}to{transform:skewX(-8deg);opacity:1;letter-spacing:.04em}}}
#ov .cd .rays,#ov .cd .lines,#ov .cd .ringw svg{display:none}
.cd.fl .flash{animation:flash2 .5s ease-out}
@keyframes flash2{0%{opacity:.7}100%{opacity:0}}
.cd.hv .flash{animation:flash2 .7s ease-out}

/* onglets sélectionnés lisibles : fond plein, texte noir */
.frame button.on,.mseg button.on,.chip.on{background:var(--accent);color:var(--accent-ink);font-weight:var(--fw-bold);text-shadow:none}
@media (prefers-reduced-motion:reduce){.rays{animation:none}.rg.run{animation-duration:.01s}}
.arena{min-height:100%;display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"h h" "m m" "a b";gap:var(--sp-3);align-content:start;padding-bottom:env(safe-area-inset-bottom,0px)}
.ahd{grid-area:h;display:flex;justify-content:space-between;align-items:center;font:var(--fw-medium) var(--fs-md) var(--font);color:var(--text-2)}
.ahd .x{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-2);width:36px;height:36px;color:var(--text);font-size:var(--fs-md)}

.s0{grid-area:a}.s1{grid-area:b}
#stg{display:block;width:min(100%,200px,27vh);aspect-ratio:1;margin:0 auto}
.tm{font-variant-numeric:tabular-nums;min-width:calc(3.7em + 36px);box-sizing:border-box;max-width:100%;text-align:center}
.side,.pk{border:1px solid var(--border);border-radius:var(--r-3);padding:var(--sp-3);display:grid;gap:6px;justify-items:center;background:var(--surface);text-align:center;align-content:start}
.pnm{font:var(--fw-semi) var(--fs-xs) var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--pc)}
.side .pimg{width:min(30vw,104px);height:min(30vw,104px)}
.bn{font:var(--fw-semi) var(--fs-lg)/1.2 var(--font);min-height:2.4em;display:flex;align-items:center;justify-content:center}.bs{font-size:var(--fs-xs);color:var(--text-2);min-height:2.4em}
.sc{font:var(--fw-semi) var(--fs-score)/1 var(--font);color:var(--pc)}
.pts{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%}
.pts button{position:relative;height:var(--btn-h);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;padding:0 var(--sp-3) 0 calc(var(--sp-3) + 3px);border:0;background:var(--bg);color:var(--text);
 clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}
.pts button:before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--pc)}

.pts button:active{background:var(--pc)}.pts button:active span,.pts button:active b{color:var(--bg)}

.tm{font:var(--fw-medium) 40px/1 var(--font);color:var(--text)}

.pks{display:flex;gap:var(--sp-2);align-items:center;text-align:left;border:1px solid var(--border);background:var(--surface-2);color:var(--text);border-radius:var(--r-2);padding:var(--sp-1);width:100%}

/* ===== Paysage (iPhone) ===== */

 .pls{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3);margin:0 var(--sp-4) var(--sp-2)}.pls .pcard{margin:0;padding:var(--sp-2);gap:var(--sp-2)}

:root[data-theme="futur"]{--grid:rgba(57,255,140,.045);--halo:rgba(57,255,140,.08)}
:root[data-theme="futurl"]{--grid:rgba(214,20,112,.06);--halo:rgba(14,159,98,.10)}
html{background-color:var(--bg);min-height:100%}
:root[data-theme^="futur"] body{background:transparent}
:root[data-theme^="futur"] body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px),radial-gradient(120% 60% at 50% 0,var(--halo),transparent 60%);background-size:28px 28px,28px 28px,100% 100%}

:root[data-theme="futur"]{--stg-rail:#39FF88}
:root[data-theme="futurl"]{--stg-rail:#D6146F;--stg-ring:#1B1018}
.prm{display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap}.prm .tp{color:var(--text)}

/* liste déroulante : l'option survolée / choisie reste lisible */
select option{background-color:var(--surface);color:var(--text)}
select option:hover,select option:focus,select option:active,select option:checked{background-color:var(--accent);background-image:linear-gradient(var(--accent),var(--accent));box-shadow:0 0 0 100px var(--accent) inset;color:var(--accent-ink)}

.cs{position:relative;display:block;width:100%;min-width:0}
.cs-auto{width:auto;flex:none}
.csn{display:none!important}
.csb{display:block;width:100%;height:var(--ctl-h);padding:0 calc(var(--sp-2) + 22px) 0 var(--sp-2);text-align:left;font:var(--fw-regular,400) var(--fs-md) var(--font);border-radius:var(--r-2);border:1px solid var(--border);background:var(--surface-2);color:var(--text);position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.csb:after{content:'';position:absolute;right:12px;top:50%;width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-70%) rotate(45deg)}
.csb:focus-visible,.csb[aria-expanded="true"]{border-color:var(--accent);outline:0}
.csb:disabled{opacity:.4}
.bar .cs{width:auto;flex:none;max-width:120px}
.bslot .csb,.g3 .csb{height:36px;font-size:var(--fs-sm)}
.rules .cs,.g3 .cs{margin-top:var(--sp-1)}
.g3 .csb,.bslot .csb{padding-left:var(--sp-1)}
.csl{position:fixed;z-index:1000;overflow:auto;background:var(--surface);border:1px solid var(--frame,var(--border));border-radius:4px;box-shadow:0 8px 24px rgba(0,0,0,.28);padding:4px;font:var(--fs-md) var(--font);color:var(--text);text-align:left}
.cso{padding:9px 12px;border-radius:3px;cursor:pointer;white-space:nowrap;color:var(--text)}
.cso:hover,.cso:focus{background:var(--accent-soft);color:var(--text);outline:0;box-shadow:inset 3px 0 0 var(--accent)}
.cso.on{background:var(--accent);color:var(--accent-ink);font-weight:var(--fw-semi)}
:is([data-theme="futur"],[data-theme="futurl"]):is([data-theme="futur"],[data-theme="futurl"]) .csb{border:1px solid var(--frame);border-radius:2px}
:is([data-theme="futur"],[data-theme="futurl"]):is([data-theme="futur"],[data-theme="futurl"]) .csb:focus-visible,:is([data-theme="futur"],[data-theme="futurl"]):is([data-theme="futur"],[data-theme="futurl"]) .csb[aria-expanded="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}

.frame.f3{grid-template-columns:repeat(3,1fr)}
.soon{text-align:left}.soon b{font:var(--fw-semi) var(--fs-lg) var(--font);color:var(--accent)}
.hist{margin-top:var(--sp-4)}.hh{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3)}
.hr{padding:var(--sp-3) 0;border-top:1px solid var(--border);display:grid;gap:4px}
.hm{display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap}.hn{font-weight:var(--fw-medium)}.hn.hw{font-weight:var(--fw-bold);text-decoration:underline;text-underline-offset:3px}
.hsc{font-size:var(--fs-lg);font-variant-numeric:tabular-nums}.hs{font-size:var(--fs-sm)}.hs i{font-style:normal;opacity:.7}.hd{font-size:var(--fs-xs)}

#bgc{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;display:none}
html[data-bg="hex"] #bgc,html[data-bg="sparks"] #bgc{display:block}
:root[data-bg="hex"][data-theme^="futur"] body::before,:root[data-bg="sparks"][data-theme^="futur"] body::before{background-image:radial-gradient(120% 60% at 50% 0,var(--halo),transparent 60%);background-size:100% 100%}
.hr2{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;justify-content:flex-end;min-width:0}
.optl{padding:var(--sp-4) var(--sp-4) var(--sp-2);color:var(--text-2);font:var(--fw-semi) 11px var(--font);letter-spacing:.14em;text-transform:uppercase}
</style>
</head>
<body>
<canvas id="bgc" aria-hidden="true"></canvas>
<div class="hdr"><h1 id="h"></h1></div>
<div class="sub" id="sub"></div>
<div id="ctl"></div>
<main id="main"></main>
<nav class="tabs" id="tabs"></nav>
<div id="ov"></div>

<script src="data.js"></script>
<script>
const TYPE={'Stamina':'var(--t-stamina)','Déf':'var(--t-def)','Attack':'var(--t-attack)','Balance':'var(--t-balance)'};
const THEMES=[['futur','Sombre'],['futurl','Clair']];
function setTheme(t){ document.documentElement.dataset.theme=t; try{ localStorage.setItem('theme',t); }catch(e){}
  drawTh(); }
function drawTh(){ if(!document.getElementById('th')) return; const cur=document.documentElement.dataset.theme||'futur'; document.getElementById('th').innerHTML=THEMES.map(([k,l])=>`<button class="${k===cur?'on':''}" onclick="setTheme('${k}')">${l}</button>`).join(''); }
drawTh();
/* ===== Fond du site : Grille (CSS) / Hexagones / Particules ===== */
const BGS={actuel:1,hex:1,sparks:1}; let bgMode='actuel',bgRun=0;
function bgPal(){ return document.documentElement.dataset.theme==='futurl'?{a:[214,20,111],b:[18,160,90],g:.07}:{a:[57,255,140],b:[255,45,149],g:.07}; }
const rg=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`, rr=(a,b)=>a+Math.random()*(b-a);
const BG={cv:null,w:0,h:0,d:1,t0:0,hex:null,cells:[],sp:[]};
function bgSize(){ const cv=BG.cv,d=Math.min(1.5,devicePixelRatio||1);BG.d=d;BG.w=innerWidth;BG.h=innerHeight;cv.width=Math.round(BG.w*d);cv.height=Math.round(BG.h*d);BG.hex=null;BG.sp=[];BG.cells=[]; }
function bgHexLayer(P){ const S=28,hh=S*Math.sqrt(3),o=document.createElement('canvas');o.width=BG.cv.width;o.height=BG.cv.height;const c=o.getContext('2d');c.scale(BG.d,BG.d);c.strokeStyle=rg(P.a,P.g);c.lineWidth=1;BG.pts=[];
  for(let col=0,x=0;x<BG.w+S*2;col++,x+=S*1.5)for(let y=(col%2)*hh/2;y<BG.h+hh;y+=hh){ BG.pts.push([x,y]);c.beginPath();for(let i=0;i<6;i++){const a=Math.PI/3*i;c.lineTo(x+S*Math.cos(a),y+S*Math.sin(a));}c.closePath();c.stroke(); }
  BG.hexS=S;BG.hex=o;BG.hexTheme=document.documentElement.dataset.theme; }
function bgFrame(t,id){
  if(id!==bgRun) return; requestAnimationFrame(tt=>bgFrame(tt,id));
  if(document.hidden||!BG.cv) return;
  const c=BG.cv.getContext('2d'),P=bgPal(); c.setTransform(1,0,0,1,0,0); c.clearRect(0,0,BG.cv.width,BG.cv.height); c.setTransform(BG.d,0,0,BG.d,0,0);
  if(bgMode==='hex'){
    if(!BG.hex||BG.hexTheme!==document.documentElement.dataset.theme) bgHexLayer(P);
    c.drawImage(BG.hex,0,0,BG.w,BG.h);
    if(!BG.cells.length) for(let i=0;i<10;i++) BG.cells.push({p:BG.pts[Math.floor(rr(0,BG.pts.length))],ph:rr(0,6),sp:rr(.5,1.1),k:i%3===0});
    const S=BG.hexS;
    BG.cells.forEach(e=>{ const a=Math.max(0,Math.sin(t/1000*e.sp+e.ph)); if(a<=0){ if(Math.random()<.02) e.p=BG.pts[Math.floor(rr(0,BG.pts.length))]; return; }
      c.beginPath();for(let i=0;i<6;i++){const an=Math.PI/3*i;c.lineTo(e.p[0]+S*Math.cos(an),e.p[1]+S*Math.sin(an));}c.closePath();
      c.fillStyle=rg(e.k?P.b:P.a,a*.18);c.fill();c.strokeStyle=rg(e.k?P.b:P.a,a*.5);c.lineWidth=1;c.stroke(); });
  } else if(bgMode==='sparks'){
    const dt=Math.min(.05,(t-(BG.t0||t))/1000);BG.t0=t;
    if(!BG.sp.length) for(let i=0;i<70;i++) BG.sp.push({x:rr(0,BG.w),y:rr(0,BG.h),r:rr(.9,2.6),v:rr(22,70),k:i%4===0,ph:rr(0,6),dr:rr(8,22),f:rr(.4,1)});
    BG.sp.forEach(p=>{ p.y-=p.v*dt; p.x+=Math.sin(t/1000*p.f+p.ph)*p.dr*dt;
      if(p.y<-10){ p.y=BG.h+10; p.x=rr(0,BG.w); }
      const a=.3+.6*Math.abs(Math.sin(t/800*p.f+p.ph)),col=p.k?P.b:P.a;
      c.fillStyle=rg(col,a);c.shadowColor=rg(col,.9);c.shadowBlur=10;c.beginPath();c.arc(p.x,p.y,p.r,0,7);c.fill(); });
    c.shadowBlur=0;
  }
}
function setBg(m){ if(!BGS[m]) m='actuel'; bgMode=m; document.documentElement.dataset.bg=m; try{ localStorage.setItem('bg',m); }catch(e){}
    bgRun++; BG.t0=0; BG.sp=[]; BG.cells=[]; if(m!=='actuel'){ BG.cv=document.getElementById('bgc'); bgSize(); requestAnimationFrame(t=>bgFrame(t,bgRun)); } }
addEventListener('resize',()=>{ if(bgMode!=='actuel') bgSize(); });
{ let m='actuel'; try{ m=localStorage.getItem('bg')||'actuel'; }catch(e){} setBg(m); }
/* Les toupies viennent de data.js */
function fatal(titre,lignes){
  document.body.innerHTML='<div style="padding:24px;font:16px/1.5 system-ui,sans-serif;color:#E5E7EB;background:#111318;min-height:100vh"><h2 style="color:#E58FB4;margin:0 0 12px">'+titre+'</h2>'+lignes.map(l=>'<p>'+l+'</p>').join('')+'</div>';
  throw new Error(titre);
}
if(typeof TOUPIES==='undefined'||!Array.isArray(TOUPIES)||!TOUPIES.length)
  fatal('data.js ne se charge pas',['Le fichier <b>data.js</b> est absent, vide ou contient une erreur : une virgule, une apostrophe ou une accolade oubliée. Compare avec un bloc qui marchait.']);
const NORM_T={attack:'Attack',attaque:'Attack',def:'Déf','déf':'Déf',defense:'Déf','défense':'Déf',stamina:'Stamina',endurance:'Stamina',balance:'Balance',equilibre:'Balance','équilibre':'Balance'};
const normT=v=>NORM_T[String(v||'').trim().toLowerCase()]||'';
const pw=v=>{ if(v===undefined||v===null||v==='') return ''; if(typeof v==='number') return v; const s=String(v).replace(/g/gi,'').replace(',','.').trim(); return /^[0-9.]+$/.test(s)?parseFloat(s):s; };
const avg=v=>typeof v==='string'&&v.includes('-')?v.split('-').reduce((a,b)=>a+ +b,0)/2:parseFloat(v);
const ERR=[];
const T=TOUPIES.map((o,i)=>{
  const nm=o.blade||('toupie n°'+(i+1));
  const l=String(o.ligne||'').trim().toUpperCase(), bty=normT(o.typeBlade), t=normT(o.typeToupie);
  const wb=pw(o.poidsBlade), wr=pw(o.poidsRatchet), wbt=pw(o.poidsBit);
  if(!o.blade) ERR.push(nm+' : il manque <b>blade</b>');
  if(!o.bit) ERR.push(nm+' : il manque <b>bit</b>');
  if(!['BX','UX','CX'].includes(l)) ERR.push(nm+' : <b>ligne</b> doit être BX, UX ou CX');
  if(!bty) ERR.push(nm+' : <b>typeBlade</b> doit être Attack, Déf, Stamina ou Balance');
  if(!t) ERR.push(nm+' : <b>typeToupie</b> doit être Attack, Déf, Stamina ou Balance');
  if(wb===''||isNaN(avg(wb))) ERR.push(nm+' : <b>poidsBlade</b> doit être un nombre');
  if(wbt===''||isNaN(avg(wbt))) ERR.push(nm+' : <b>poidsBit</b> doit être un nombre');
  if(wr!==''&&isNaN(avg(wr))) ERR.push(nm+' : <b>poidsRatchet</b> doit être un nombre (ou \'\' s\'il n\'y a pas de ratchet)');
  const hasTot=o.total!==undefined&&o.total!==null&&o.total!=='';
  const tot=hasTot?pw(o.total):Math.round((avg(wb)+(wr===''?0:avg(wr))+avg(wbt))*10)/10;
  const ar=v=>Array.isArray(v)&&v.length===3?v.map(Number):null;
  return {b:o.blade||'?',bty,l,t,r:o.ratchet||'',bt:o.bit||'?',wb,wr,wbt,tot,sb:ar(o.statsBlade),sr:ar(o.statsRatchet),sbt:ar(o.statsBit),h:o.hauteurRatchet||'',dash:o.dashBit||'',burst:o.burstBit||'',_p:{blade:o.photoBlade,ratchet:o.photoRatchet,bit:o.photoBit}};
});
if(ERR.length) fatal('Il y a une erreur dans data.js',[...ERR,'Corrige ça dans <b>data.js</b>, puis recharge la page.']);
T.forEach(x=>x.n=(x.b+' '+(x.r||'')+x.bt).replace('  ',' ').trim());
const IM={},PH={};
T.forEach(x=>{ PH[x.n]={}; for(const k of ['blade','ratchet','bit']){ const p=x._p[k]; if(p){ PH[x.n][k]=p; IM[p]=p; } } });
const num=v=>parseFloat(String(v));

const LINE_ORDER=['BX','UX','CX'],TYPE_ORDER=['Attack','Déf','Stamina','Balance'];
const LINE_COL={BX:'var(--l-bx)',UX:'var(--l-ux)',CX:'var(--l-cx)'};
const DEF_DESC={nom:false,poids:true,ligne:false,type:false,att:true,def:true,end:true,haut:false,dash:true,burst:true};
const SI={att:0,def:1,end:2};
const st={tab:'toupies',view:'collection',cat:'blades',key:'nom',desc:false,q:'',a:0,b:1,son:true,voix:false};
let AC=null,run=0;
const sv=(p)=>`<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const IC={grid:sv('<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>'),
  build:sv('<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/>'),
  bolt:sv('<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>'),
  opts:sv('<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/>'),
  search:'<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>'};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const hit=(s)=>!st.q||s.toLowerCase().includes(st.q.trim().toLowerCase());

function sortList(list,key,desc,val){
  const d=desc?-1:1;
  return [...list].sort((x,y)=>{
    const a=val(x,key),b=val(y,key);
    const c=typeof a==='string'?a.localeCompare(b,'fr'):a-b;
    return c?d*c:x.n.localeCompare(y.n,'fr');
  });
}
function keysFor(){
  const S=[['att','Attaque'],['def','Défense'],['end','Stamina']];
  if(st.view==='collection') return [['nom','Nom'],['poids','Poids'],['ligne','Ligne'],['type','Type'],...S];
  return st.cat==='ratchets'?[['nom','Nom'],['poids','Poids'],['haut','Hauteur'],...S]:st.cat==='bits'?[['nom','Nom'],['poids','Poids'],['type','Type'],['dash','Dash'],['burst','Burst'],...S]:[['nom','Nom'],['poids','Poids'],['type','Type'],...S];
}
function curKey(){ return keysFor().some(a=>a[0]===st.key)?st.key:'nom'; }
function flipLbl(){ const t=['nom','ligne','type'].includes(curKey()); return st.desc?(t?'Z→A':'9→1'):(t?'A→Z':'1→9'); }
function setKey(k){ st.key=k; st.desc=DEF_DESC[k]; const f=document.getElementById('fl'); if(f) f.textContent=flipLbl(); renderList(); }
function flip(){ st.desc=!st.desc; draw(); }
function setView(v){ st.view=v; draw(); }
function setCat(c){ st.cat=c; draw(); }
function setQ(v){ st.q=v; renderList(); }
function optSet(k,v){ if(k==='theme') setTheme(v); else setBg(v); draw(); }
function optsUI(){
  const th=document.documentElement.dataset.theme||'futur';
  const seg=(k,list,cur,f3)=>'<div class="frame'+(f3?' f3':'')+'">'+list.map(([v,l])=>`<button class="${cur===v?'on':''}" onclick="optSet('${k}','${v}')"><span>${l}</span></button>`).join('')+'</div>';
  return '<div class="optl">Thème</div>'+seg('theme',THEMES,th,false)+'<div class="optl">Fond</div>'+seg('bg',[['actuel','Grille'],['hex','Hexagones'],['sparks','Particules']],bgMode,true)+'<div class="mut note">Ces choix sont gardés sur cet appareil.</div>';
}
function setTab(t){ st.tab=t; draw(); window.scrollTo(0,0); }

function partItems(){
  const P=x=>PH[x.n]||{};
  if(st.cat==='ratchets') return T.filter(x=>x.r).map(x=>({n:x.r,w:x.wr,img:P(x).ratchet,ty:'',l:'',s:x.sr,h:x.h,ex:x.h?`Hauteur <b>${x.h}</b>`:''}));
  if(st.cat==='bits') return T.map(x=>({n:x.bt,w:x.wbt,img:P(x).bit,ty:x.t,l:'',s:x.sbt,dash:x.dash,burst:x.burst,ex:(x.dash!==''?`Dash <b>${x.dash}</b> · `:'')+(x.burst!==''?`Burst <b>${x.burst}</b>`:'')}));
  return T.map(x=>({n:x.b,w:x.wb,img:P(x).blade,ty:x.bty,l:x.l,s:x.sb,ex:''}));
}
function img(p,cls){ return p?`<div class="pimg ${cls||''}"><img loading="lazy" onerror="this.remove()" src="${IM[p]}" alt=""></div>`:`<div class="pimg ${cls||''}"></div>`; }
function typ(t){ return t?`<span class="tp"><span class="dot" style="background:${TYPE[t]}"></span>${t}</span>`:''; }
const SC={A:'var(--stat-a)',D:'var(--stat-d)',S:'var(--stat-s)'};
function bars(a,mx){ if(!a) return ''; mx=mx||70; return '<div class="sb">'+['A','D','S'].map((k,i)=>`<i><span>${k}</span><u style="--w:${Math.min(100,a[i]/mx*100)}%;--c:${SC[k]}"></u><b>${a[i]}</b></i>`).join('')+'</div>'; }
const sum3=(...L)=>{ const v=L.filter(Boolean); return v.length?[0,1,2].map(i=>Math.round(v.reduce((s,a)=>s+a[i],0)*10)/10):null; };
const totSt=x=>sum3(x.sb,x.sr,x.sbt);
function card(x){
  const q=PH[x.n]||{}, g=v=>v===''?'—':v+' g';
  const pc=(lab,p,w,t,sa)=>`<div class="pc">${img(p,'xs')}<span>${lab}</span><b>${g(w)}</b>${t?typ(t):'<span class="tp">&nbsp;</span>'}${bars(sa)}</div>`;
  const T3=totSt(x), ex=[x.h?`Hauteur <b>${x.h}</b>`:'',x.dash!==''?`Dash <b>${x.dash}</b>`:'',x.burst!==''?`Burst <b>${x.burst}</b>`:'',T3?`<em class="t3">Total <b>A ${T3[0]} · D ${T3[1]} · S ${T3[2]}</b></em>`:''].filter(Boolean).join('<span></span>');
  return `<details><summary>${img(q.blade)}<div class="rm"><div class="pname">${x.n}</div><div class="meta"><span class="badge" style="--bc:${LINE_COL[x.l]}">${x.l}</span>${typ(x.t)}</div></div><div class="tot">${x.tot}<small>g</small></div></summary><div class="exp">${pc('Blade',q.blade,x.wb,x.bty,x.sb)}${pc('Ratchet',q.ratchet,x.wr,'',x.sr)}${pc('Bit',q.bit,x.wbt,x.t,x.sbt)}${ex?`<div class="ex">${ex}</div>`:''}</div></details>`;
}
function partCard(i){
  const bd=i.l?`<span class="badge" style="--bc:${LINE_COL[i.l]}">${i.l}</span>`:'';
  return `<div class="rw">${img(i.img)}<div class="rm"><div class="pname">${i.n}</div><div class="meta">${bd}${typ(i.ty)}</div>${i.s?`<div class="stl">A <b>${i.s[0]}</b> · D <b>${i.s[1]}</b> · S <b>${i.s[2]}</b>${i.ex?' · '+i.ex:''}</div>`:''}</div><div class="tot">${i.w}<small>g</small></div></div>`;
}
function group(key,g){ return `<div class="gh">${key==='type'?`<span class="dot" style="background:${TYPE[g]}"></span>`:''}${g}</div>`; }
function collection(key){
  const L=sortList(T.filter(x=>hit(x.n+' '+x.l+' '+x.t)),key,st.desc,(x,k)=>k==='nom'?x.n:k==='poids'?x.tot:k==='ligne'?LINE_ORDER.indexOf(x.l):k==='type'?TYPE_ORDER.indexOf(x.t):((totSt(x)||[0,0,0])[SI[k]]));
  let last=null,html='';
  for(const x of L){
    if(key==='ligne'||key==='type'){ const g=key==='ligne'?x.l:x.t; if(g!==last){ html+=group(key,g); last=g; } }
    html+=card(x);
  }

  ST.fx.forEach(s=>{c.globalAlpha=Math.max(0,s.life/s.max);c.fillStyle=s.c;c.fillRect(s.x*sc-1.5,s.y*sc-1.5,3*dpr/1.5,3*dpr/1.5);});c.globalAlpha=1;
}
function stLoop(id){
  if(id!==ST.loop) return;
  const cv=document.getElementById('stg'); if(!cv){ST.loop=0;return;}
  const now=performance.now(),dt=Math.min(.033,(now-ST.last)/1000||.016);ST.last=now;
  stStep(dt);stDraw(cv);requestAnimationFrame(()=>stLoop(id));
}
function mountStage(){
  const cv=document.getElementById('stg'); if(!cv||!G){ST.loop=0;return;}
  const ph=G.phase;
  if(ph==='ready'){ if(ST.mode!=='idle') stInit('idle'); }
  else if(ph==='fight'){ if(ST.mode!=='battle') stInit('battle'); }
  else if(ph==='scored'||ph==='over'){
    const h=G.hist[G.hist.length-1];
    if(h&&ST.fid!==G.hist.length){ if(ST.mode!=='battle'&&ST.mode!=='fin') stInit('battle'); if(ST.mode==='fin') stInit('battle'); ST.fid=G.hist.length; stFinish(h); }
  }
  stDraw(cv);
  if(!ST.loop){ST.loop=++stId;ST.last=performance.now();requestAnimationFrame(()=>stLoop(ST.loop));}
}
function arena(){
  if(!G) return;
  if(G.phase==='pick') return pickUI();
  const h=G.hist[G.hist.length-1];
  const last=h?(h.p>=0?`${esc(G.M.names[h.p])} +${h.pts}${h.k?' · '+FL(h.k):''}`:'Round nul'):'';
  const mid={
    ready:`<canvas id="stg"></canvas><div class="mut">Quand vous êtes prêts, appuyez chacun sur <b>Prêt</b> : le 3, 2, 1 part tout seul</div>`,
    fight:`<div class="tm" id="tm">${fmt(Date.now()-G.t0)}</div><canvas id="stg"></canvas><button class="chip" onclick="nul()">Round nul</button>`,
    scored:`<div class="tm">${fmt(G.t)}</div><canvas id="stg"></canvas><div class="bn2">${last}</div><div class="row2"><button class="chip" onclick="undo()">Annuler</button><button class="go sm" onclick="nextRound()">Round suivant</button></div>`,
    over:`<div class="win">${winText()}</div><canvas id="stg"></canvas><div class="row2"><button class="chip" onclick="undo()">Annuler</button><button class="chip" onclick="stopMatch()">Fermer</button><button class="go sm" onclick="startMatch()">Rejouer</button></div>`
  }[G.phase];
  setOv(`<div class="arena"><div class="ahd">${xbtn}<span>Round ${G.round}${G.max?' sur '+G.max:''}</span><span>Premier à ${G.M.target}</span></div><div class="mid">${mid}</div>${side(0)}${side(1)}</div>`);
  mountStage();
}
async function launch(){
  if(!G||G.phase!=='ready') return;
  const id=++run; G.phase='count';
  if(G.tour) G.cur.forEach((s,p)=>{ if(!G.used[p].includes(s)) G.used[p].push(s); });
  setOv('<div class="cd" id="cd" onclick="cancelCount()"><div class="rays"></div><div class="flash"></div><div class="ringw"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="rd" cx="50" cy="50" r="49.5"/><circle class="rt" cx="50" cy="50" r="46"/><circle class="rg" id="rg" cx="50" cy="50" r="46" pathLength="100"/></svg><div id="big"></div></div><div class="lines"><i></i><i></i></div><div id="duel"></div></div>');
  const big=document.getElementById('big'), cd=document.getElementById('cd'), rg=document.getElementById('rg');
  document.getElementById('duel').textContent=cur(0).blade+'  ×  '+cur(1).blade;
  const words=['','un','deux','trois'];
  const show=n=>{ big.className=''; big.textContent=n; cd.classList.remove('fl'); void cd.offsetWidth; cd.classList.add('fl'); buzz(60); };
  const hyper=()=>{ big.className='txt'; big.textContent='Hyper vitesse'; cd.classList.remove('fl'); void cd.offsetWidth; cd.classList.add('hv'); buzz([200,60,200]); };
  if(st.son&&SND.cd){
    /* le son dit « 3, 2, 1, Hyper vitesse » : les flashs suivent les mots (temps en secondes) */
    const T=[[3,.1],[2,1.1],[1,1.9]],HV=2.7,END=4.4;
    try{ SND.cd.currentTime=0; const r=SND.cd.play(); if(r&&r.catch) r.catch(()=>{}); }catch(e){}
    const t0=performance.now(), at=async s=>{ const d=s*1000-(performance.now()-t0); if(d>0) await wait(d); };
    for(const [n,s] of T){ await at(s); if(id!==run) return; show(n); }
    await at(HV); if(id!==run) return; hyper();
    await at(END);
  }else{
    for(const n of [3,2,1]){
      if(id!==run) return;
      show(n); beep(660,.25); say(words[n],'fr-FR');
      await wait(1000);
    }
    if(id!==run) return;
    hyper(); beep(1100,.8,.4); say('Hyper vitesse','fr-FR');
    await wait(900);
  }
  if(id!==run||!G) return;
  G.phase='fight'; G.t0=Date.now(); arena(); startTimer();
}
function cancelCount(){
  if(!G||G.phase!=='count') return;
  run++; try{ speechSynthesis.cancel(); }catch(e){} try{ SND.cd.pause(); }catch(e){}
  if(G.tour) G.cur.forEach((s,p)=>{ const i=G.used[p].lastIndexOf(s); if(i>=0) G.used[p].splice(i,1); });
  G.ready=[false,false]; G.phase='ready'; arena();
}
/* ===== Historique des matchs (par catégorie, gardé sur l'appareil) ===== */
const HKEY='arene_hist';
function hLoad(){ try{ return JSON.parse(localStorage.getItem(HKEY)||'[]'); }catch(e){ return []; } }
function hSave(a){ try{ localStorage.setItem(HKEY,JSON.stringify(a.slice(0,300))); }catch(e){} }
function histAdd(){
  try{
    const names=[0,1].map(p=>(G.tour?G.used[p]:[G.cur[p]]).map(sl=>resolve(G.M.p[p][sl]).name));
    const rec={id:Date.now(),cat:G.tour?'tournoi':'simple',n:[G.M.names[0],G.M.names[1]],b:names,s:[G.score[0],G.score[1]],tg:G.M.target,r:G.hist.length,w:G.score[0]>G.score[1]?0:G.score[1]>G.score[0]?1:-1};
    const a=hLoad(); a.unshift(rec); hSave(a); G.hid=rec.id;
  }catch(e){}
}
function histDel(id){ hSave(hLoad().filter(r=>r.id!==id)); }
function histClear(cat){ if(confirm('Vider l\'historique de cette catégorie ?')){ hSave(hLoad().filter(r=>r.cat!==cat)); drawMatch(); } }
function histUI(cat){
  const L=hLoad().filter(r=>r.cat===cat),title=cat==='tournoi'?'Match 3v3':'Match simple';
  const when=id=>{ const d=new Date(id); return d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})+' · '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); };
  const rows=L.slice(0,40).map(r=>{
    const w=r.w,nm=i=>`<span class="hn ${w===i?'hw':''}" style="color:${i?'var(--pink)':'var(--pa)'}">${esc(r.n[i])}</span>`;
    return `<div class="hr"><div class="hd mut">${when(r.id)} · ${r.r} round${r.r>1?'s':''} · à ${r.tg}</div><div class="hm">${nm(0)}<b class="hsc">${r.s[0]} – ${r.s[1]}</b>${nm(1)}</div><div class="hs mut">${r.b[0].map(esc).join(' · ')} <i>vs</i> ${r.b[1].map(esc).join(' · ')}</div>${w<0?'<div class="mut">Égalité</div>':''}</div>`;
  }).join('');
  return `<div class="pcard hist"><div class="hh"><div class="sl">Historique · ${title}</div>${L.length?`<button class="chip" onclick="histClear('${cat}')">Vider</button>`:''}</div>${L.length?`<div class="mut">${L.length} match${L.length>1?'s':''} terminé${L.length>1?'s':''}</div>${rows}`:'<div class="mut">Aucun match pour l\'instant. Termine un match pour le retrouver ici.</div>'}</div>`;
}
function endRound(){
  stopTimer(); G.t=Date.now()-G.t0;
  const t=G.M.target;
  G.phase=(G.score[0]>=t||G.score[1]>=t||(G.max&&G.round>=G.max))?'over':'scored';
  if(G.phase==='over'){ histAdd(); [784,988,1319].forEach((f,i)=>setTimeout(()=>beep(f,.4,.35),i*220)); buzz([120,60,120,60,300]); }
  arena();
}
function score(p,pts,k){
  if(!G||G.phase!=='fight') return;
  G.score[p]+=pts; G.hist.push({p,pts,k,t:Date.now()-G.t0});
  playSnd('sc'); buzz(50); endRound();
}
function nul(){ if(!G||G.phase!=='fight') return; playSnd('nul'); G.hist.push({p:-1,pts:0,t:Date.now()-G.t0}); endRound(); }
function undo(){
  if(!G||G.phase==='fight'||!G.hist.length) return;
  if(G.hid){ histDel(G.hid); G.hid=null; }
  const h=G.hist.pop(); if(h.p>=0) G.score[h.p]-=h.pts;
  G.phase='fight'; G.t0=Date.now()-h.t; arena(); startTimer();
}
function nextRound(){
  if(!G||G.phase!=='scored') return; playSnd('next');
  G.round++; G.pick=[null,null]; G.ready=[false,false]; G.phase=G.tour?'pick':'ready'; arena();
}
function ctx(){ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); return AC; }
function beep(f,d,v){
  if(!st.son) return;
  try{ const a=ctx(),t=a.currentTime,o=a.createOscillator(),g=a.createGain(),lp=a.createBiquadFilter();
    o.type='sine'; o.frequency.value=f*.7; lp.type='lowpass'; lp.frequency.value=900;
    const vol=(v||.3)*.16, dur=Math.max(d,.16);
    g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(vol,t+.05);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(lp); lp.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+.02);
  }catch(e){}
}
function say(txt,lang){
  if(!st.voix||!('speechSynthesis' in window)) return;
  try{ const u=new SpeechSynthesisUtterance(txt); u.lang=lang; u.rate=1.05; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){}
}
function buzz(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }
const wait=ms=>new Promise(r=>setTimeout(r,ms));

/* ===== Listes déroulantes maison (lisibles dans les deux thèmes) ===== */
let csOpen=null;
function csClose(){ if(csOpen){ csOpen.list.remove(); csOpen.btn.setAttribute('aria-expanded','false'); csOpen=null; } }
function csShow(sel,btn){
  csClose();
  const l=document.createElement('div'); l.className='csl'; l.setAttribute('role','listbox');
  [...sel.options].forEach((o,i)=>{ const it=document.createElement('div'); it.className='cso'+(i===sel.selectedIndex?' on':''); it.setAttribute('role','option'); it.tabIndex=-1; it.textContent=o.textContent;
    it.onclick=()=>{ csClose(); if(sel.selectedIndex!==i){ sel.selectedIndex=i; sel.dispatchEvent(new Event('change',{bubbles:true})); } btn.focus&&0; };
    l.appendChild(it); });
  document.body.appendChild(l);
  const r=btn.getBoundingClientRect(),h=Math.min(l.scrollHeight,Math.round(innerHeight*.5),320);
  l.style.minWidth=r.width+'px'; l.style.maxHeight=h+'px';
  const below=innerHeight-r.bottom, up=r.top>h+8&&below<h+8;
  l.style.left=Math.max(4,Math.min(r.left,innerWidth-l.offsetWidth-4))+'px';
  l.style.top=(up?r.top-h-4:r.bottom+4)+'px';
  const on=l.querySelector('.on'); if(on) l.scrollTop=on.offsetTop-l.clientHeight/2+on.offsetHeight/2;
  btn.setAttribute('aria-expanded','true'); csOpen={list:l,btn};
  l.addEventListener('keydown',e=>{ const its=[...l.children],i=its.indexOf(document.activeElement);
    if(e.key==='Escape'){ csClose(); btn.focus(); } else if(e.key==='ArrowDown'){ e.preventDefault(); (its[i+1]||its[0]).focus(); } else if(e.key==='ArrowUp'){ e.preventDefault(); (its[i-1]||its[its.length-1]).focus(); } else if(e.key==='Enter'||e.key===' '){ e.preventDefault(); document.activeElement.click(); } });
}
function csEnhance(root){
  root.querySelectorAll('select:not([data-cs])').forEach(sel=>{
    sel.dataset.cs='1';
    const w=document.createElement('div'); w.className='cs';
    const b=document.createElement('button'); b.type='button'; b.className='csb'; b.setAttribute('aria-haspopup','listbox'); b.setAttribute('aria-expanded','false');
    if(sel.id==='k') w.classList.add('cs-auto');
    const lab=()=>{ const o=sel.options[sel.selectedIndex]; b.textContent=o?o.textContent:''; };
    lab(); b.disabled=sel.disabled; b.onclick=e=>{ e.preventDefault(); if(csOpen&&csOpen.btn===b) csClose(); else csShow(sel,b); };
    b.onkeydown=e=>{ if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); csShow(sel,b); const f=csOpen&&csOpen.list.querySelector('.on')||csOpen.list.firstChild; f&&f.focus(); } };
    sel.parentNode.insertBefore(w,sel); w.appendChild(b); w.appendChild(sel); sel.classList.add('csn');
  });
}
document.addEventListener('click',e=>{ if(csOpen&&!csOpen.list.contains(e.target)&&!csOpen.btn.contains(e.target)) csClose(); },true);
addEventListener('resize',csClose); addEventListener('scroll',csClose,true);
new MutationObserver(()=>csEnhance(document.body)).observe(document.body,{childList:true,subtree:true});
csEnhance(document.body);
draw();
</script>
